name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit runtime and build dependencies (fail on any known severity)
        run: pnpm run security:audit-dependencies
      - name: Dependency runtime regression tests
        run: pnpm --filter @workspace/api-server run test:dependency-runtime
      - name: Native mockup discovery regression tests
        run: node --test scripts/check-mockup-discovery.test.mjs
      - name: Payment and Academy offline regression tests
        run: |
          pnpm --filter @workspace/api-server run test:academy-funnel-delivery
          pnpm --filter @workspace/api-server run test:academy-email-html
          pnpm --filter @workspace/api-server run test:academy-access-email
          pnpm --filter @workspace/api-server run test:academy-admin-security
          pnpm --filter @workspace/api-server run test:production-signing
          pnpm --filter @workspace/api-server run test:academy-access-code
          pnpm --filter @workspace/api-server run test:academy-verification-security
          pnpm --filter @workspace/api-server run test:billing-webhook-security
          pnpm --filter @workspace/api-server run test:asaas-webhook-token-isolation
          pnpm --filter @workspace/api-server run test:billing-settlement
          pnpm --filter @workspace/api-server run test:orchestration-fallback-race
          pnpm --filter @workspace/api-server run test:boot-recovery-safety
          env -u DATABASE_URL -u REDIS_URL pnpm --filter @workspace/api-server run test:operational-health
      - name: Credential security regression tests
        run: |
          pnpm run security:check-runtime-logging
          pnpm run security:check-academy-client
          pnpm --filter @workspace/api-server run test:log-security
          pnpm --filter @workspace/db run test:token-encryption
          pnpm --filter @workspace/api-server run test:integration-security
          pnpm --filter @workspace/api-server run test:auth-cookie-security
      - run: pnpm run build
      - name: Paid Academy material must be absent from public build
        run: node scripts/check-academy-paid-bundle.mjs

  auth-database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexos_ci
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ci-only-session-signing-fixture
      APP_URL: http://localhost:8081
      ALLOWED_ORIGINS: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate a masked encryption key for disposable test rows
        run: node scripts/generate-ci-integration-key.mjs
      - name: Bootstrap a disposable database and verify migrations
        run: |
          pnpm --filter @workspace/db run test:bootstrap-rollback
          pnpm --filter @workspace/db run bootstrap:empty
          pnpm --filter @workspace/db run seed:plans
          pnpm --filter @workspace/db run verify
          pnpm --filter @workspace/db run migrate:tracked
      - name: Authentication and encrypted credential database tests
        run: |
          pnpm --filter @workspace/db run test:token-encryption -- --database
          pnpm --filter @workspace/api-server run test:auth-registration-db
          node --test scripts/test-private-context-storage.mjs
          pnpm --filter @workspace/api-server run test:project-execution-isolation
          pnpm --filter @workspace/api-server run test:project-isolation-db
          pnpm --filter @workspace/api-server run test:platform-admin-db
          pnpm --filter @workspace/api-server run test:auth-sessions-http
          pnpm --filter @workspace/api-server run test:realtime-security-db
          pnpm --filter @workspace/api-server run test:academy-funnel-db
          pnpm --filter @workspace/api-server run test:academy-settlement-db
          pnpm --filter @workspace/api-server run test:academy-access-outbox-db
          pnpm --filter @workspace/api-server run test:academy-delivery-lifecycle-db
          pnpm --filter @workspace/api-server run test:academy-p0-db
          pnpm --filter @workspace/api-server run test:academy-content-db
          pnpm --filter @workspace/api-server run test:academy-quota-redis
          pnpm --filter @workspace/api-server run test:billing-reversal-db
          pnpm --filter @workspace/api-server run test:billing-plan-activation-db
          pnpm --filter @workspace/api-server run test:billing-credit-concurrency-db
          pnpm --filter @workspace/api-server run test:content-checkpoint-resume
          pnpm --filter @workspace/db run verify
