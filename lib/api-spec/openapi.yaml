openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NexOS AI — Campaign execution and launch automation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: campaigns
  - name: intake
  - name: launch-sequences
  - name: sequence-items
  - name: credits
  - name: autonomy

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Tokens and workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /auth/onboarding/seen:
    post:
      operationId: markOnboardingSeen
      tags: [auth]
      summary: Mark the welcome/onboarding flow as seen
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string

  # ─── Campaigns ─────────────────────────────────────────────────────────────
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: "#/components/schemas/Campaign"
                required: [campaigns]
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create campaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: "#/components/schemas/Campaign"
                required: [campaign]

  /campaigns/{campaignId}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get campaign
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      responses:
        "200":
          description: Campaign detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: "#/components/schemas/Campaign"
                required: [campaign]

  /campaigns/{campaignId}/control-room/evidence:
    get:
      operationId: getCampaignControlRoomEvidence
      tags: [campaigns]
      summary: List sanitized campaign execution evidence
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ExecutionEvidenceState"
        - name: subjectType
          in: query
          schema:
            $ref: "#/components/schemas/ExecutionEvidenceSubjectType"
        - name: subjectId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Inclusive UTC lower bound.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive UTC upper bound.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Deterministically paginated and sanitized evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRoomEvidenceResponse"
        "400":
          description: Invalid filters or cursor
        "404":
          description: Campaign not found in the authenticated workspace

  /campaigns/{campaignId}/control-room/previews:
    get:
      operationId: getCampaignControlRoomPreviews
      tags: [campaigns]
      summary: List safe read-only universal previews
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ControlRoomPreviewKind" }
        - name: status
          in: query
          schema: { type: string }
        - name: updatedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: updatedTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Deterministically paginated sanitized previews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlRoomPreviewsResponse" }
        "400": { description: Invalid filters or cursor }
        "404": { description: Campaign not found in authenticated workspace }

  /campaigns/{campaignId}/control-room/version-sources:
    get:
      operationId: getCampaignControlRoomVersionSources
      tags: [campaigns]
      summary: List immutable campaign version sources
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/campaignId" }]
      responses:
        "200":
          description: Version catalog
          content: { application/json: { schema: { $ref: "#/components/schemas/ControlRoomVersionSourcesResponse" } } }
        "404": { description: Campaign not found in authenticated workspace }

  /campaigns/{campaignId}/control-room/version-diff:
    get:
      operationId: getCampaignControlRoomVersionDiff
      tags: [campaigns]
      summary: Compare two immutable campaign versions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/campaignId" }
        - { name: resource, in: query, required: true, schema: { type: string, enum: [masterplan, page] } }
        - { name: sourceId, in: query, schema: { type: string, format: uuid } }
        - { name: baseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: targetId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: maxChanges, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: Deterministic sanitized diff
          content: { application/json: { schema: { $ref: "#/components/schemas/ControlRoomVersionDiffResponse" } } }
        "400": { description: Invalid parameters }
        "404": { description: Version not found in authenticated workspace }

  /campaigns/{campaignId}/execute:
    post:
      operationId: executeCampaign
      tags: [campaigns]
      summary: Execute campaign phase
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignExecuteInput"
      responses:
        "202":
          description: Execution queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: string
        "428":
          description: Required product autonomy contract acceptances are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractAcceptanceRequiredError"
        "423":
          description: A mandatory safety pause blocks this external action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandatoryPauseActiveError"

  # ─── Product autonomy contract ─────────────────────────────────────────────
  /autonomy/status:
    get:
      operationId: getAutonomyStatus
      tags: [autonomy]
      summary: Current product autonomy contract and acceptance status
      security:
        - bearerAuth: []
      parameters:
        - name: campaignId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Current contract status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyStatus"
  /autonomy/acceptances:
    post:
      operationId: acceptAutonomyContract
      tags: [autonomy]
      summary: Record idempotent contract acceptances
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutonomyAcceptanceInput"
      responses:
        "201":
          description: Acceptances recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyAcceptanceResponse"
  /autonomy/acceptances/{acceptanceId}/revoke:
    post:
      operationId: revokeAutonomyAcceptance
      tags: [autonomy]
      summary: Revoke a contract acceptance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/acceptanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutonomyRevocationInput"
      responses:
        "200":
          description: Acceptance revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyAcceptanceResponse"
  /autonomy/evidence:
    get:
      operationId: listAutonomyEvidence
      tags: [autonomy]
      summary: Contract acceptance evidence and history
      security:
        - bearerAuth: []
      parameters:
        - name: campaignId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Acceptance evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyEvidenceResponse"
  /autonomy/pauses:
    get:
      operationId: listMandatoryPauses
      tags: [autonomy]
      summary: List workspace mandatory safety pauses
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campaignId
          in: query
          schema: { type: string }
        - name: activeOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Mandatory pause history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandatoryPauseListResponse" }
    post:
      operationId: createMandatoryPause
      tags: [autonomy]
      summary: Create an idempotent mandatory safety pause
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MandatoryPauseInput" }
      responses:
        "201":
          description: Pause recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandatoryPauseResponse" }
  /autonomy/pauses/{pauseId}/resolve:
    post:
      operationId: resolveMandatoryPause
      tags: [autonomy]
      summary: Resolve a mandatory pause with human evidence
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/pauseId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MandatoryPauseResolutionInput" }
      responses:
        "200":
          description: Pause resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandatoryPauseResponse" }

  # ─── Intake ────────────────────────────────────────────────────────────────
  /intake/{campaignId}:
    get:
      operationId: getIntake
      tags: [intake]
      summary: Get intake data
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      responses:
        "200":
          description: Intake data and questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeResponse"
    post:
      operationId: saveIntake
      tags: [intake]
      summary: Save intake answers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeSaveInput"
      responses:
        "200":
          description: Saved intake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeResponse"

  /intake/{campaignId}/score:
    get:
      operationId: getIntakeScore
      tags: [intake]
      summary: Get launch readiness score
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      responses:
        "200":
          description: Readiness score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeScore"

  # ─── Launch Sequences ──────────────────────────────────────────────────────
  /launch-sequences:
    get:
      operationId: listSequences
      tags: [launch-sequences]
      summary: List launch sequences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sequence list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequences:
                    type: array
                    items:
                      $ref: "#/components/schemas/LaunchSequence"
                required: [sequences]
    post:
      operationId: createSequence
      tags: [launch-sequences]
      summary: Create launch sequence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceInput"
      responses:
        "201":
          description: Created sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchSequence"

  /launch-sequences/{sequenceId}:
    get:
      operationId: getSequence
      tags: [launch-sequences]
      summary: Get sequence with items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      responses:
        "200":
          description: Sequence detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequence:
                    $ref: "#/components/schemas/LaunchSequenceDetail"
                required: [sequence]

  /launch-sequences/{sequenceId}/generate:
    post:
      operationId: generateSequencePlan
      tags: [launch-sequences]
      summary: Generate AI sequence plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      responses:
        "200":
          description: Generated plan and items
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemsCreated:
                    type: integer
                  sequence:
                    $ref: "#/components/schemas/LaunchSequenceDetail"

  /launch-sequences/{sequenceId}/activate:
    post:
      operationId: activateSequence
      tags: [launch-sequences]
      summary: Activate sequence
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceActivationInput"
      responses:
        "200":
          description: Activated sequence
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequence:
                    $ref: "#/components/schemas/LaunchSequenceDetail"

  /launch-sequences/{sequenceId}/calendar:
    get:
      operationId: getSequenceCalendar
      tags: [launch-sequences]
      summary: Day-by-day launch calendar
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      responses:
        "200":
          description: Calendar view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"

  /launch-sequences/{sequenceId}/today:
    get:
      operationId: getSequenceToday
      tags: [launch-sequences]
      summary: Current day dashboard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      responses:
        "200":
          description: Today view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayResponse"

  /launch-sequences/{sequenceId}/analytics:
    get:
      operationId: getSequenceAnalytics
      tags: [launch-sequences]
      summary: Sequence analytics and segments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"

  /launch-sequences/{sequenceId}/contacts:
    get:
      operationId: listSequenceContacts
      tags: [launch-sequences]
      summary: List contacts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/SequenceContact"
                  total:
                    type: integer
                required: [contacts, total]
    post:
      operationId: addSequenceContacts
      tags: [launch-sequences]
      summary: Add contacts to sequence
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactsAddInput"
      responses:
        "201":
          description: Added contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/SequenceContact"
                  total:
                    type: integer

  # ─── Sequence Items ────────────────────────────────────────────────────────
  /launch-sequences/{sequenceId}/items/{itemId}/generate-copy:
    post:
      operationId: generateItemCopy
      tags: [sequence-items]
      summary: Generate AI copy for item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCopyInput"
      responses:
        "200":
          description: Generated copy
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/SequenceItem"

  # ─── Credits ───────────────────────────────────────────────────────────────
  /credits/balance:
    get:
      operationId: getCreditsBalance
      tags: [credits]
      summary: Get workspace credits balance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditsBalance"

  # ─── Paid media ────────────────────────────────────────────────────────────
  /paid-media/accounts/{provider}/discover:
    get:
      operationId: discoverPaidMediaAccounts
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PaidMediaProvider" }]
      responses:
        "200": { description: Discovered advertiser accounts, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaAccountDiscoveryResponse" } } } }
        "400": { $ref: "#/components/responses/PaidMediaValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/PaidMediaConflict" }
        "429": { $ref: "#/components/responses/PaidMediaProviderError" }
        "502": { $ref: "#/components/responses/PaidMediaProviderError" }
  /paid-media/accounts/{provider}:
    get:
      operationId: listPaidMediaAccounts
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PaidMediaProvider" }]
      responses:
        "200": { description: Workspace advertiser accounts, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaAccountsResponse" } } } }
        "400": { $ref: "#/components/responses/PaidMediaValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /paid-media/accounts/{provider}/{accountId}/select:
    post:
      operationId: selectPaidMediaAccount
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PaidMediaProvider" }
        - { $ref: "#/components/parameters/PaidMediaAccountId" }
      responses:
        "200": { description: Selected advertiser account, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaAccountSelectionResponse" } } } }
        "400": { $ref: "#/components/responses/PaidMediaValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /paid-media/accounts/{accountId}/sync:
    post:
      operationId: syncPaidMediaAccount
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PaidMediaAccountId" }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaSyncInput" } } } }
      responses:
        "200": { description: Synchronization result, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaSyncResult" } } } }
        "400": { $ref: "#/components/responses/PaidMediaValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/PaidMediaConflict" }
        "429": { $ref: "#/components/responses/PaidMediaProviderError" }
        "502": { $ref: "#/components/responses/PaidMediaProviderError" }
  /paid-media/sync-status:
    get:
      operationId: getPaidMediaSyncStatus
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Synchronization cursors, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaSyncStatusResponse" } } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /paid-media/policies:
    get:
      operationId: listPaidMediaPolicies
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspace paid-media policies, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaPoliciesResponse" } } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /paid-media/policies/{policyId}:
    put:
      operationId: updatePaidMediaPolicy
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PaidMediaPolicyId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaPolicyUpdateInput" } } } }
      responses:
        "200": { description: Updated policy, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaPolicyResponse" } } } }
        "400": { $ref: "#/components/responses/PaidMediaValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /paid-media/proposals/generate:
    post:
      operationId: generatePaidMediaProposal
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaProposalGenerateInput" } } } }
      responses:
        "201": { description: Proposal created, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaProposalResponse" } } } }
        "400": { $ref: "#/components/responses/PaidMediaValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/PaidMediaConflict" }
        "423": { $ref: "#/components/responses/PaidMediaLocked" }
        "502": { $ref: "#/components/responses/PaidMediaProviderError" }
  /paid-media/proposals:
    get:
      operationId: listPaidMediaProposals
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Proposals, content: { application/json: { schema: { type: object, properties: { proposals: { type: array, items: { $ref: "#/components/schemas/PaidMediaProposal" } } }, required: [proposals] } } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /paid-media/proposals/{proposalId}:
    get:
      operationId: getPaidMediaProposal
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Proposal, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaProposalResponse" } } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /paid-media/proposals/{proposalId}/approve:
    post:
      operationId: approvePaidMediaProposal
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PaidMediaProposalId" }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaProposalDecisionInput" } } } }
      responses:
        "200": { description: Approved proposal, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaProposal" } } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/PaidMediaConflict" }
  /paid-media/proposals/{proposalId}/reject:
    post:
      operationId: rejectPaidMediaProposal
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PaidMediaProposalId" }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaProposalDecisionInput" } } } }
      responses:
        "200": { description: Rejected proposal, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaProposal" } } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/PaidMediaConflict" }
  /paid-media/proposals/{proposalId}/execute:
    post:
      operationId: executePaidMediaProposal
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PaidMediaProposalId" }]
      responses:
        "200": { description: Execution attempt, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaActionAttempt" } } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/PaidMediaConflict" }
        "423": { $ref: "#/components/responses/PaidMediaLocked" }
        "429": { $ref: "#/components/responses/PaidMediaProviderError" }
        "502": { $ref: "#/components/responses/PaidMediaProviderError" }
  /paid-media/attempts:
    get:
      operationId: listPaidMediaActionAttempts
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspace action attempts, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaActionAttemptsResponse" } } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /paid-media/attempts/{attemptId}:
    get:
      operationId: getPaidMediaActionAttempt
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PaidMediaAttemptId" }]
      responses:
        "200": { description: Action attempt, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaActionAttemptResponse" } } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /paid-media/attempts/{attemptId}/rollback:
    post:
      operationId: rollbackPaidMediaActionAttempt
      tags: [paid-media]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PaidMediaAttemptId" }]
      responses:
        "200": { description: Rollback result, content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaProviderActionResult" } } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/PaidMediaConflict" }
        "423": { $ref: "#/components/responses/PaidMediaLocked" }
        "429": { $ref: "#/components/responses/PaidMediaProviderError" }
        "502": { $ref: "#/components/responses/PaidMediaProviderError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PaidMediaProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [meta_ads, tiktok_ads, google_ads] }
    PaidMediaAccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaidMediaPolicyId:
      name: policyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaidMediaProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaidMediaAttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    campaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
    sequenceId:
      name: sequenceId
      in: path
      required: true
      schema:
        type: string
    acceptanceId:
      name: acceptanceId
      in: path
      required: true
      schema:
        type: string
    pauseId:
      name: pauseId
      in: path
      required: true
      schema: { type: string }

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── Auth ───────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    RegisterInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        planSlug:
          type: string
      required: [email, password, name]

    RefreshTokenInput:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"
        workspace:
          $ref: "#/components/schemas/Workspace"
      required: [accessToken, refreshToken, user, workspace]

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        workspace:
          $ref: "#/components/schemas/Workspace"
      required: [user, workspace]

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        locale:
          type: string
          enum: [pt-BR, en-US, en-AU, es-LA]
        hasSeenOnboarding:
          type: boolean
      required: [id, email]

    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        plan:
          type: string
        creditsBalance:
          type: integer
        campaignsUsed:
          type: integer
        campaignsLimit:
          type: integer
      required: [id, name]

    # ─── Campaigns ──────────────────────────────────────────────────────────
    Campaign:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        track:
          type: string
        status:
          type: string
        revenueTarget:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        intakeCompleteness:
          type: object
          description: Only present for campaigns in `intake` status — mirrors the exact percentage shown on the intake page itself.
          properties:
            answeredRequired:
              type: integer
            totalRequired:
              type: integer
            percentage:
              type: integer
      required: [id, title, type, status]

    CampaignInput:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum:
            - launch
            - evergreen
            - relaunch
            - perpetual_launch
            - flash_sale
            - live_sale
            - continuous_sales
            - subscription_growth
            - authority
            - audience_growth
            - branding
            - creator_monetization
            - upsell
            - remarketing
            - affiliate
            - scale
            - regional_dominance
            - semente_launch
        track:
          type: string
          enum: [six_digits, eight_digits, ten_digits]
        revenueTarget:
          type: string
      required: [title, type, track]

    CampaignExecuteInput:
      type: object
      properties:
        phase:
          type: string
          enum: [strategy, content, launch, monitor]
      required: [phase]

    ExecutionEvidenceState:
      type: string
      enum: [planned, attempted, provider_confirmed, artifact_qc]

    ExecutionEvidenceSubjectType:
      type: string
      enum:
        - social_post
        - paid_media_attempt
        - paid_media_launch_plan
        - paid_media_proposal
        - product_sale
        - revenue_event

    ControlRoomEvidenceSource:
      type: object
      properties:
        kind:
          type: string
          enum: [social_post]
        label:
          type: string
        href:
          type: string
      required: [kind, label, href]

    ControlRoomEvidenceRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subjectType:
          type: string
        subjectId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ExecutionEvidenceState"
        createdAt:
          type: string
          format: date-time
        masterplanVersionId:
          type: ["string", "null"]
          format: uuid
        contextFingerprint:
          type: ["string", "null"]
          description: Sanitized opaque prefix only.
        details:
          description: Recursively sanitized, size-bounded evidence details.
        source:
          anyOf:
            - $ref: "#/components/schemas/ControlRoomEvidenceSource"
            - type: "null"
      required:
        - id
        - subjectType
        - subjectId
        - state
        - createdAt
        - masterplanVersionId
        - contextFingerprint
        - details
        - source

    ControlRoomEvidenceFacet:
      type: object
      properties:
        value:
          type: string
        count:
          type: integer
          minimum: 0
      required: [value, count]

    ControlRoomEvidenceFilters:
      type: object
      properties:
        state:
          type: ["string", "null"]
        subjectType:
          type: ["string", "null"]
        subjectId:
          type: ["string", "null"]
        from:
          type: ["string", "null"]
        to:
          type: ["string", "null"]
      required: [state, subjectType, subjectId, from, to]

    ControlRoomEvidenceResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ControlRoomEvidenceRecord"
        pageInfo:
          type: object
          properties:
            nextCursor:
              type: ["string", "null"]
            hasNextPage:
              type: boolean
            limit:
              type: integer
          required: [nextCursor, hasNextPage, limit]
        appliedFilters:
          $ref: "#/components/schemas/ControlRoomEvidenceFilters"
        total:
          type: integer
          minimum: 0
        facets:
          type: object
          properties:
            states:
              type: array
              items:
                $ref: "#/components/schemas/ControlRoomEvidenceFacet"
            subjectTypes:
              type: array
              items:
                $ref: "#/components/schemas/ControlRoomEvidenceFacet"
          required: [states, subjectTypes]
      required: [records, pageInfo, appliedFilters, total, facets]

    ControlRoomPreviewKind:
      type: string
      enum: [content_piece, media_brief, creative, social_post, campaign_asset, page, video_project]

    ControlRoomPreviewRecord:
      type: object
      properties:
        source:
          type: object
          properties:
            kind: { $ref: "#/components/schemas/ControlRoomPreviewKind" }
            id: { type: string, format: uuid }
            type: { type: string }
            status: { type: string }
            title: { type: string }
            updatedAt: { type: string, format: date-time }
          required: [kind, id, type, status, title, updatedAt]
        preview:
          type: object
          properties:
            state: { type: string, enum: [ready, unavailable] }
            representation: { type: string, enum: [text, image, video, page, message, ad, structured] }
            reason: { type: ["string", "null"] }
            content: { nullable: true }
          required: [state, representation, reason, content]
        sourceLink: { type: ["string", "null"] }
      required: [source, preview]

    ControlRoomPreviewsResponse:
      type: object
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/ControlRoomPreviewRecord" }
        pageInfo:
          type: object
          properties:
            nextCursor: { type: ["string", "null"] }
            hasNextPage: { type: boolean }
            limit: { type: integer }
          required: [nextCursor, hasNextPage, limit]
        appliedFilters:
          type: object
          properties:
            kind: { $ref: "#/components/schemas/ControlRoomPreviewKind", nullable: true }
            status: { type: ["string", "null"] }
            updatedFrom: { type: ["string", "null"] }
            updatedTo: { type: ["string", "null"] }
          required: [kind, status, updatedFrom, updatedTo]
        total: { type: integer, minimum: 0 }
      required: [records, pageInfo, appliedFilters, total]

    ContractMetadata:
      type: object
      properties:
        key: { type: string }
        version: { type: string }
        hash: { type: string }
        snapshot:
          type: object
          additionalProperties: {}
      required: [key, version, hash, snapshot]
    AutonomyAcceptance:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        userId: { type: string }
        campaignId: { type: ["string", "null"] }
        contractKey: { type: string }
        contractVersion: { type: string }
        contractHash: { type: string }
        acceptanceType: { type: string, enum: [autonomy, regulated_activity, asset_rights] }
        evidenceSnapshot:
          type: object
          additionalProperties: {}
        acceptedAt: { type: string }
        ipAddress: { type: ["string", "null"] }
        userAgent: { type: ["string", "null"] }
        revokedAt: { type: ["string", "null"] }
        revokedByUserId: { type: ["string", "null"] }
        revocationReason: { type: ["string", "null"] }
      required: [id, workspaceId, userId, contractKey, contractVersion, contractHash, acceptanceType, evidenceSnapshot, acceptedAt]
    AutonomyStatus:
      type: object
      properties:
        contract: { $ref: "#/components/schemas/ContractMetadata" }
        campaignId: { type: ["string", "null"] }
        requiredAcceptanceTypes:
          type: array
          items: { type: string, enum: [autonomy, regulated_activity, asset_rights] }
        acceptedAcceptanceTypes:
          type: array
          items: { type: string, enum: [autonomy, regulated_activity, asset_rights] }
        missingAcceptanceTypes:
          type: array
          items: { type: string, enum: [autonomy, regulated_activity, asset_rights] }
        regulatedActivityRequired: { type: boolean }
      required: [contract, requiredAcceptanceTypes, acceptedAcceptanceTypes, missingAcceptanceTypes, regulatedActivityRequired]
    AutonomyAcceptanceInput:
      type: object
      properties:
        campaignId: { type: string }
        acceptanceTypes:
          type: array
          minItems: 1
          items: { type: string, enum: [autonomy, regulated_activity, asset_rights] }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
      required: [acceptanceTypes, idempotencyKey]
    AutonomyRevocationInput:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }
    AutonomyAcceptanceResponse:
      type: object
      properties:
        acceptances:
          type: array
          items: { $ref: "#/components/schemas/AutonomyAcceptance" }
        acceptance: { $ref: "#/components/schemas/AutonomyAcceptance" }
        status: { $ref: "#/components/schemas/AutonomyStatus" }
        contract: { $ref: "#/components/schemas/ContractMetadata" }
      additionalProperties: true
    AutonomyEvidenceResponse:
      type: object
      properties:
        acceptances:
          type: array
          items: { $ref: "#/components/schemas/AutonomyAcceptance" }
      required: [acceptances]
    ContractAcceptanceRequiredError:
      type: object
      properties:
        error: { type: string }
        code: { type: string, enum: [CONTRACT_ACCEPTANCE_REQUIRED] }
        data:
          type: object
          properties:
            contract: { $ref: "#/components/schemas/ContractMetadata" }
            requiredAcceptanceTypes:
              type: array
              items: { type: string, enum: [autonomy, regulated_activity, asset_rights] }
            missingAcceptanceTypes:
              type: array
              items: { type: string, enum: [autonomy, regulated_activity, asset_rights] }
          required: [contract, requiredAcceptanceTypes, missingAcceptanceTypes]
      required: [error, code, data]
    MandatoryPause:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        campaignId: { type: ["string", "null"] }
        channel: { type: ["string", "null"], enum: [campaign, instagram, facebook, tiktok, email, whatsapp, null] }
        action: { type: ["string", "null"], enum: [launch, social_publish, email_dispatch, whatsapp_dispatch, null] }
        pauseClass: { type: string, enum: [probable_illegality, fraud, rights_violation, severe_account_ban_risk, overspend, severe_reputational_crisis] }
        severity: { type: string }
        status: { type: string, enum: [active, resolved] }
        reason: { type: string }
        evidenceSummary: { type: string }
        sourceActor: { type: string }
        sourceType: { type: string, enum: [user, automated] }
        idempotencyKey: { type: string }
        resolvedAt: { type: ["string", "null"] }
        resolvedByUserId: { type: ["string", "null"] }
        resolutionReason: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, workspaceId, pauseClass, severity, status, reason, evidenceSummary, sourceActor, sourceType, idempotencyKey, createdAt]
    MandatoryPauseInput:
      type: object
      properties:
        campaignId: { type: string }
        channel: { type: string, enum: [campaign, instagram, facebook, tiktok, email, whatsapp] }
        action: { type: string, enum: [launch, social_publish, email_dispatch, whatsapp_dispatch] }
        pauseClass: { type: string, enum: [probable_illegality, fraud, rights_violation, severe_account_ban_risk, overspend, severe_reputational_crisis] }
        severity: { type: string, minLength: 1, maxLength: 32 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        evidenceSummary: { type: string, minLength: 1, maxLength: 2000 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
      required: [pauseClass, severity, reason, evidenceSummary, idempotencyKey]
    MandatoryPauseResolutionInput:
      type: object
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
      required: [reason]
    MandatoryPauseResponse:
      type: object
      properties:
        pause: { $ref: "#/components/schemas/MandatoryPause" }
      required: [pause]
    MandatoryPauseListResponse:
      type: object
      properties:
        pauses:
          type: array
          items: { $ref: "#/components/schemas/MandatoryPause" }
      required: [pauses]
    MandatoryPauseActiveError:
      type: object
      properties:
        error: { type: string }
        code: { type: string, enum: [MANDATORY_PAUSE_ACTIVE] }
        data:
          type: object
          additionalProperties: {}
      required: [error, code, data]

    # ─── Intake ─────────────────────────────────────────────────────────────
    IntakeSaveInput:
      type: object
      properties:
        intakeData:
          type: object
          additionalProperties: {}
      required: [intakeData]

    IntakeResponse:
      type: object
      properties:
        intakeData:
          type: object
          additionalProperties: {}
        completeness:
          type: integer
        missingRequired:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/IntakeQuestion"
      required: [intakeData, completeness]

    IntakeQuestion:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
        required:
          type: boolean
        category:
          type: string
      required: [key, label, type]

    IntakeScore:
      type: object
      properties:
        score:
          type: integer
        label:
          type: string
        details:
          type: object
          additionalProperties: {}
      required: [score, label]

    # ─── Launch Sequences ───────────────────────────────────────────────────
    SequenceInput:
      type: object
      properties:
        name:
          type: string
        model:
          type: string
          enum: [plf, formula_de_lancamento, semente, afiliado, perpetual, custom]
        totalDays:
          type: integer
        productName:
          type: string
        productPrice:
          type: string
        revenueTarget:
          type: string
        cartOpenDate:
          type: string
        cartCloseDate:
          type: string
        campaignId:
          type: string
      required: [name, model, totalDays]

    SequenceActivationInput:
      type: object
      properties:
        startAt:
          type: string
        emailProvider:
          type: string
        emailListId:
          type: string
        whatsappEnabled:
          type: boolean

    LaunchSequence:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
        status:
          type: string
        totalDays:
          type: integer
        productName:
          type: string
        productPrice:
          type: string
        revenueTarget:
          type: string
        cartOpenDate:
          type: ["string", "null"]
        cartCloseDate:
          type: ["string", "null"]
        campaignId:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, name, model, status, totalDays]

    LaunchSequenceDetail:
      allOf:
        - $ref: "#/components/schemas/LaunchSequence"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SequenceItem"
            aiGeneratedPlan:
              type: object
              nullable: true
              additionalProperties: {}
            config:
              type: object
              nullable: true
              additionalProperties: {}
          required: [items]

    SequenceItem:
      type: object
      properties:
        id:
          type: string
        phase:
          type: string
        name:
          type: string
        description:
          type: string
        dayIndex:
          type: integer
        channel:
          type: string
        mentalTrigger:
          type: string
        status:
          type: string
        metadata:
          type: object
          nullable: true
          additionalProperties: {}
        scheduledAt:
          type: ["string", "null"]
      required: [id, phase, name, dayIndex, channel, status]

    ContactInput:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        phone:
          type: string
      required: [email]

    ContactsAddInput:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactInput"
      required: [contacts]

    ItemCopyInput:
      type: object
      properties:
        contactSegment:
          type: string
          enum: [hot, warm, cold]

    # ─── Calendar ───────────────────────────────────────────────────────────
    CalendarDay:
      type: object
      properties:
        dayIndex:
          type: integer
        date:
          type: ["string", "null"]
        phaseLabel:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/SequenceItem"
        hasCopy:
          type: boolean
      required: [dayIndex, phaseLabel, items, hasCopy]

    CalendarResponse:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/CalendarDay"
        phases:
          type: array
          items:
            type: object
            additionalProperties: {}
        milestones:
          type: array
          items:
            type: object
            additionalProperties: {}
        summary:
          type: object
          nullable: true
          additionalProperties: {}
      required: [days]

    # ─── Today ──────────────────────────────────────────────────────────────
    TodayResponse:
      type: object
      properties:
        currentDayIndex:
          type: integer
        currentPhaseLabel:
          type: string
        progress:
          type: integer
        today:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SequenceItem"
        tomorrow:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SequenceItem"
        nextSevenDays:
          type: array
          items:
            $ref: "#/components/schemas/CalendarDay"
        performance:
          type: object
          additionalProperties: {}
        warnings:
          type: array
          items:
            type: string
      required: [currentDayIndex, progress]

    # ─── Analytics ──────────────────────────────────────────────────────────
    AnalyticsSegments:
      type: object
      properties:
        hot:
          type: integer
        warm:
          type: integer
        cold:
          type: integer
        converted:
          type: integer
        unsubscribed:
          type: integer
      required: [hot, warm, cold, converted, unsubscribed]

    AnalyticsData:
      type: object
      properties:
        sequenceId:
          type: string
        segments:
          $ref: "#/components/schemas/AnalyticsSegments"
        byItem:
          type: array
          items:
            type: object
            additionalProperties: {}
        adaptiveSuggestions:
          type: array
          items:
            type: string
        healthScore:
          type: integer
        engagementTrend:
          type: string
      required: [sequenceId, segments, healthScore]

    AnalyticsResponse:
      type: object
      properties:
        analytics:
          $ref: "#/components/schemas/AnalyticsData"
      required: [analytics]

    # ─── Contacts ───────────────────────────────────────────────────────────
    SequenceContact:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        segment:
          type: string
        engagementScore:
          type: integer
        itemsReceived:
          type: integer
        itemsOpened:
          type: integer
        conversions:
          type: integer
        createdAt:
          type: string
      required: [id, email, segment]

    # ─── Credits ────────────────────────────────────────────────────────────
    CreditsBalance:
      type: object
      properties:
        balance:
          type: integer
        used:
          type: integer
        limit:
          type: integer
      required: [balance]

    PaidMediaProposalGenerateInput:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        actionType: { type: string, enum: [pause, resume, update_daily_budget, update_bid] }
        proposedChange: { type: object, additionalProperties: {} }
        optimizationOutput: { type: object, additionalProperties: {} }
        idempotencyKey: { type: string }
      required: [accountId, entityId, actionType, proposedChange]
    PaidMediaProviderAccount:
      type: object
      properties:
        providerAccountId: { type: string }
        name: { type: string }
        currency: { type: string }
        timezone: { type: string }
      required: [providerAccountId, name, currency, timezone]
    PaidMediaAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        providerAccountId: { type: string }
        accountName: { type: [string, "null"] }
        currency: { type: string }
        timezone: { type: string }
        isSelected: { type: boolean }
      required: [id, providerAccountId, currency, timezone, isSelected]
    PaidMediaAccountDiscoveryResponse:
      type: object
      properties:
        accounts: { type: array, items: { $ref: "#/components/schemas/PaidMediaProviderAccount" } }
        selectionRequired: { type: boolean }
      required: [accounts, selectionRequired]
    PaidMediaAccountsResponse:
      type: object
      properties: { accounts: { type: array, items: { $ref: "#/components/schemas/PaidMediaAccount" } } }
      required: [accounts]
    PaidMediaAccountSelectionResponse:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        providerAccountId: { type: string }
        selected: { type: boolean }
      required: [accountId, providerAccountId, selected]
    PaidMediaSyncInput:
      type: object
      properties:
        since: { type: string, format: date }
        until: { type: string, format: date }
    PaidMediaSyncError:
      type: object
      properties: { entityType: { type: string, enum: [campaign, ad_set, ad, creative] }, message: { type: string } }
      required: [entityType, message]
    PaidMediaSyncResult:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        entitiesUpserted: { type: integer }
        insightsUpserted: { type: integer }
        errors: { type: array, items: { $ref: "#/components/schemas/PaidMediaSyncError" } }
      required: [accountId, entitiesUpserted, insightsUpserted, errors]
    PaidMediaSyncCursor:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        entityType: { type: string, enum: [campaign, ad_set, ad, creative] }
        cursor: { type: [string, "null"] }
        syncedThrough: { type: [string, "null"], format: date-time }
        claimedAt: { type: [string, "null"], format: date-time }
        claimToken: { type: [string, "null"], format: uuid }
        lastError: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, workspaceId, accountId, entityType, createdAt, updatedAt]
    PaidMediaSyncStatusResponse:
      type: object
      properties: { cursors: { type: array, items: { $ref: "#/components/schemas/PaidMediaSyncCursor" } } }
      required: [cursors]
    PaidMediaPolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        provider: { type: [string, "null"], enum: [meta_ads, tiktok_ads, google_ads, null] }
        accountId: { type: [string, "null"], format: uuid }
        enabled: { type: boolean }
        autoExecute: { type: boolean }
        mandatoryPause: { type: boolean }
        mandatoryPauseReason: { type: [string, "null"] }
        minimumSampleSize: { type: integer }
        minimumDataQualityScore: { type: string }
        maxDailyBudgetChangePercent: { type: [string, "null"] }
        maxDailyBudgetChangeAbsolute: { type: [string, "null"] }
        maxBidChangePercent: { type: [string, "null"] }
        acceptedAt: { type: [string, "null"], format: date-time }
        acceptanceExpiresAt: { type: [string, "null"], format: date-time }
        acceptedBy: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, workspaceId, enabled, autoExecute, mandatoryPause, minimumSampleSize, minimumDataQualityScore, createdAt, updatedAt]
    PaidMediaPolicyUpdateInput:
      type: object
      properties:
        enabled: { type: boolean }
        mandatoryPause: { type: boolean }
        mandatoryPauseReason: { type: [string, "null"] }
        minimumSampleSize: { type: integer, minimum: 0 }
        minimumDataQualityScore: { type: number, minimum: 0, maximum: 1 }
        maxDailyBudgetChangePercent: { type: [number, "null"], minimum: 0 }
        maxDailyBudgetChangeAbsolute: { type: [number, "null"], minimum: 0 }
        maxBidChangePercent: { type: [number, "null"], minimum: 0 }
        acceptanceExpiresAt: { type: [string, "null"], format: date-time }
    PaidMediaPoliciesResponse:
      type: object
      properties: { policies: { type: array, items: { $ref: "#/components/schemas/PaidMediaPolicy" } } }
      required: [policies]
    PaidMediaPolicyResponse:
      type: object
      properties: { policy: { $ref: "#/components/schemas/PaidMediaPolicy" } }
      required: [policy]
    PaidMediaProposalDecisionInput:
      type: object
      properties:
        evidence: { type: object, additionalProperties: {} }
        comment: { type: string }
    PaidMediaError:
      type: object
      properties: { error: { type: string }, code: { type: string } }
      required: [error, code]
    PaidMediaProposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        accountId: { type: [string, "null"], format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        provider: { type: string, enum: [meta_ads, tiktok_ads, google_ads] }
        actionType: { type: string, enum: [pause, resume, update_daily_budget, update_bid, update_creative_status, update_creative_rotation, cross_platform_budget_move] }
        status: { type: string, enum: [pending_approval, approved, rejected, expired, executing, verified, failed, rolled_back] }
        idempotencyKey: { type: string }
        recommendation: { type: string }
        metrics: { type: object, additionalProperties: {} }
        simulation: { type: object, additionalProperties: {} }
        beforeAllocation: { type: object, additionalProperties: {} }
        afterAllocation: { type: object, additionalProperties: {} }
        requestedChange: { type: object, additionalProperties: {} }
        policyDecision: { type: object, additionalProperties: {} }
        expiresAt: { type: string, format: date-time }
      required: [id, workspaceId, provider, actionType, status, idempotencyKey, recommendation, metrics, simulation, expiresAt]
    PaidMediaProposalResponse:
      type: object
      properties: { proposal: { $ref: "#/components/schemas/PaidMediaProposal" } }
      required: [proposal]
    PaidMediaActionAttempt:
      type: object
      properties:
        id: { type: string, format: uuid }
        proposalId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        attemptNumber: { type: integer }
        status: { type: string, enum: [pending, executing, succeeded, failed, verification_failed, rolled_back] }
        idempotencyKey: { type: string }
        beforeSnapshot: { type: object, additionalProperties: {} }
        providerResponse: { type: [object, "null"], additionalProperties: {} }
        verificationEvidence: { type: [object, "null"], additionalProperties: {} }
        afterSnapshot: { type: [object, "null"], additionalProperties: {} }
        rollbackEvidence: { type: [object, "null"], additionalProperties: {} }
        errorCode: { type: [string, "null"] }
        errorMessage: { type: [string, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, proposalId, workspaceId, attemptNumber, status, idempotencyKey, beforeSnapshot, createdAt]
    PaidMediaActionAttemptsResponse:
      type: object
      properties: { attempts: { type: array, items: { $ref: "#/components/schemas/PaidMediaActionAttempt" } } }
      required: [attempts]
    PaidMediaActionAttemptResponse:
      type: object
      properties: { attempt: { $ref: "#/components/schemas/PaidMediaActionAttempt" } }
      required: [attempt]
    PaidMediaProviderActionResult:
      type: object
      properties:
        providerRequestId: { type: string }
        evidence: { type: object, additionalProperties: {} }
      required: [evidence]
    ControlRoomVersionSource:
      type: object
      additionalProperties: false
      required: [id, kind, label, historyAvailable, comparable, versionCount, catalogTruncated]
      properties:
        id: { type: string }
        kind: { type: string, enum: [masterplan, page, content_piece, media_brief, creative, social_post, campaign_asset, video_project] }
        label: { type: string }
        historyAvailable: { type: boolean }
        comparable: { type: boolean }
        versionCount: { type: integer, minimum: 0 }
        catalogTruncated: { type: boolean }
        reason: { type: string }
        versions: { type: array, items: { $ref: "#/components/schemas/ControlRoomVersionMetadata" } }
        current: { $ref: "#/components/schemas/ControlRoomCurrentVersionMetadata" }
    ControlRoomVersionMetadata:
      type: object
      additionalProperties: false
      required: [id, label, status, createdAt, contentHash]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        contentHash: { type: string }
        version: { type: integer }
        revision: { type: integer }
    ControlRoomCurrentVersionMetadata:
      type: object
      additionalProperties: false
      required: [id, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
    ControlRoomVersionSourcesResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, sources]
      properties:
        schemaVersion: { type: integer, const: 1 }
        sources: { type: array, items: { $ref: "#/components/schemas/ControlRoomVersionSource" } }
    ControlRoomVersionDiffResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, available, resource, base, target, summary, changes, warnings]
      properties:
        schemaVersion: { type: integer, const: 1 }
        available: { type: boolean }
        resource: { type: string, enum: [masterplan, page] }
        source: { $ref: "#/components/schemas/ControlRoomDiffSourceMetadata" }
        base: { $ref: "#/components/schemas/ControlRoomVersionMetadata" }
        target: { $ref: "#/components/schemas/ControlRoomVersionMetadata" }
        summary: { $ref: "#/components/schemas/ControlRoomDiffSummary" }
        changes: { type: array, items: { $ref: "#/components/schemas/ControlRoomDiffChange" } }
        warnings: { type: array, items: { type: string } }
    ControlRoomDiffSourceMetadata:
      type: object
      additionalProperties: false
      required: [id]
      properties: { id: { type: string } }
    ControlRoomDiffSummary:
      type: object
      additionalProperties: false
      required: [added, removed, changed, unchanged, truncated]
      properties:
        added: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        changed: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        truncated: { type: boolean }
    ControlRoomDiffChange:
      type: object
      additionalProperties: false
      required: [kind, path, category]
      properties:
        kind: { type: string, enum: [added, removed, changed] }
        path: { type: string }
        category: { type: string, enum: [cta, media, rules, phase, text, structure, masterplan] }
        before: { $ref: "#/components/schemas/ControlRoomJsonValue" }
        after: { $ref: "#/components/schemas/ControlRoomJsonValue" }
    ControlRoomJsonValue:
      nullable: true
      oneOf:
        - { type: string }
        - { type: number }
        - { type: boolean }
        - { type: array, items: { $ref: "#/components/schemas/ControlRoomJsonValue" } }
        - { type: object, additionalProperties: { $ref: "#/components/schemas/ControlRoomJsonValue" } }
  responses:
    PaidMediaValidationError:
      description: Invalid paid-media request
      content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaError" } } }
    UnauthorizedError:
      description: Authentication required
      content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaError" } } }
    NotFoundError:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaError" } } }
    PaidMediaConflict:
      description: Paid-media precondition or idempotency conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaError" } } }
    PaidMediaLocked:
      description: Execution blocked by mandatory pause or acceptance
      content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaError" } } }
    PaidMediaProviderError:
      description: Upstream advertising provider failed
      content: { application/json: { schema: { $ref: "#/components/schemas/PaidMediaError" } } }
