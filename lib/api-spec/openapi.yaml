openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NexOS AI — Campaign execution and launch automation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: campaigns
  - name: intake
  - name: launch-sequences
  - name: sequence-items
  - name: credits
  - name: autonomy

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Tokens and workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /auth/onboarding/seen:
    post:
      operationId: markOnboardingSeen
      tags: [auth]
      summary: Mark the welcome/onboarding flow as seen
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Rotate the HttpOnly refresh session and issue an access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the browser refresh session and clear its cookie
      responses:
        "204":
          description: Session revoked

  # ─── Campaigns ─────────────────────────────────────────────────────────────
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: "#/components/schemas/Campaign"
                required: [campaigns]
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create campaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: "#/components/schemas/Campaign"
                required: [campaign]

  /campaigns/{campaignId}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get campaign
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      responses:
        "200":
          description: Campaign detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: "#/components/schemas/Campaign"
                required: [campaign]

  /campaigns/{campaignId}/control-room/approvals:
    get:
      operationId: getCampaignControlRoomApprovals
      tags: [campaigns]
      summary: approvals
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/campaignId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 25, default: 25 }
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/ControlRoomApprovalsResponse" } } }

  /campaigns/{campaignId}/control-room/approvals/{subjectType}/{subjectId}/decision:
    post:
      operationId: decideCampaignControlRoomApproval
      tags: [campaigns]
      summary: decide
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/campaignId"
        - name: subjectType
          in: path
          required: true
          schema: { type: string }
        - name: subjectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalDecisionInput" } } }
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalDecisionResponse" } } }

  /campaigns/{campaignId}/control-room/approvals/{subjectType}/{subjectId}/sla:
    post:
      operationId: scheduleCampaignApprovalSla
      tags: [campaigns]
      summary: sla
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/campaignId"
        - name: subjectType
          in: path
          required: true
          schema: { type: string }
        - name: subjectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalSlaInput" } } }
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalSlaResponse" } } }

  /campaigns/{campaignId}/control-room/execution-policy:
    get:
      operationId: getConditionalExecutionPolicy
      tags: [campaigns]
      summary: get policy
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/campaignId"
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/ConditionalExecutionResponse" } } }
    post:
      operationId: createConditionalExecutionPolicy
      tags: [campaigns]
      summary: create policy
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/campaignId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConditionalExecutionPolicyInput" } } }
      responses:
        "201":
          description: ok
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /campaigns/{campaignId}/control-room/execution-policy/{version}/revoke:
    post:
      operationId: revokeConditionalExecutionPolicy
      tags: [campaigns]
      summary: revoke policy
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/campaignId"
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /campaigns/{campaignId}/control-room/conditional-executions:
    get:
      operationId: listConditionalExecutions
      tags: [campaigns]
      summary: list exec
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/campaignId"
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/ConditionalExecutionResponse" } } }

  /realizations:
    post:
      operationId: createRealizationContract
      tags: [realization]
      summary: Create realization contract
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealizationContractInput" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/RealizationContract" } } }
    get:
      operationId: listRealizationContracts
      tags: [realization]
      summary: List realization contracts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campaignId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of contracts
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RealizationContract" } } } }

  /realizations/{id}:
    get:
      operationId: getRealizationContract
      tags: [realization]
      summary: Get contract
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Contract
          content: { application/json: { schema: { $ref: "#/components/schemas/RealizationContractDetail" } } }

  /realizations/{id}/preflight:
    post:
      operationId: preflightRealization
      tags: [realization]
      summary: Preflight realization
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Preflight result, content: { application/json: { schema: { $ref: "#/components/schemas/RealizationContract" } } } } }

  /realizations/{id}/execute:
    post:
      operationId: executeRealization
      tags: [realization]
      summary: Execute realization
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Execution result, content: { application/json: { schema: { $ref: "#/components/schemas/RealizationActionResult" } } } } }

  /realizations/{id}/retry:
    post:
      operationId: retryRealization
      tags: [realization]
      summary: Retry realization
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Retry accepted, content: { application/json: { schema: { $ref: "#/components/schemas/RealizationContract" } } } } }

  /realizations/{id}/qc:
    post:
      operationId: qcRealization
      tags: [realization]
      summary: QC realization
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: QC result, content: { application/json: { schema: { $ref: "#/components/schemas/RealizationContract" } } } } }

  /realizations/{id}/monitor:
    post:
      operationId: monitorRealization
      tags: [realization]
      summary: Monitor realization
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Monitoring result, content: { application/json: { schema: { $ref: "#/components/schemas/RealizationContract" } } } } }

  /realizations/{id}/compensate:
    post:
      operationId: compensateRealization
      tags: [realization]
      summary: Compensate realization
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Compensation result, content: { application/json: { schema: { $ref: "#/components/schemas/RealizationContract" } } } } }


  /campaigns/{campaignId}/control-room/evidence:
    get:
      operationId: getCampaignControlRoomEvidence
      tags: [campaigns]
      summary: List sanitized campaign execution evidence
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ExecutionEvidenceState"
        - name: subjectType
          in: query
          schema:
            $ref: "#/components/schemas/ExecutionEvidenceSubjectType"
        - name: subjectId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Inclusive UTC lower bound.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive UTC upper bound.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Deterministically paginated and sanitized evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRoomEvidenceResponse"
        "400":
          description: Invalid filters or cursor
        "404":
          description: Campaign not found in the authenticated workspace

  /campaigns/{campaignId}/control-room/previews:
    get:
      operationId: getCampaignControlRoomPreviews
      tags: [campaigns]
      summary: List safe read-only universal previews
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ControlRoomPreviewKind" }
        - name: status
          in: query
          schema: { type: string }
        - name: updatedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: updatedTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Deterministically paginated sanitized previews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlRoomPreviewsResponse" }
        "400": { description: Invalid filters or cursor }
        "404": { description: Campaign not found in authenticated workspace }

  /campaigns/{campaignId}/control-room/version-sources:
    get:
      operationId: getCampaignControlRoomVersionSources
      tags: [campaigns]
      summary: List immutable campaign version sources
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/campaignId" }]
      responses:
        "200":
          description: Version catalog
          content: { application/json: { schema: { $ref: "#/components/schemas/ControlRoomVersionSourcesResponse" } } }
        "404": { description: Campaign not found in authenticated workspace }

  /campaigns/{campaignId}/control-room/version-diff:
    get:
      operationId: getCampaignControlRoomVersionDiff
      tags: [campaigns]
      summary: Compare two immutable campaign versions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/campaignId" }
        - { name: resource, in: query, required: true, schema: { type: string, enum: [masterplan, page] } }
        - { name: sourceId, in: query, schema: { type: string, format: uuid } }
        - { name: baseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: targetId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: maxChanges, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: Deterministic sanitized diff
          content: { application/json: { schema: { $ref: "#/components/schemas/ControlRoomVersionDiffResponse" } } }
        "400": { description: Invalid parameters }
        "404": { description: Version not found in authenticated workspace }

  /campaigns/{campaignId}/execute:
    post:
      operationId: executeCampaign
      tags: [campaigns]
      summary: Execute campaign phase
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignExecuteInput"
      responses:
        "202":
          description: Execution queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: string
        "428":
          description: Required product autonomy contract acceptances are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractAcceptanceRequiredError"
        "423":
          description: A mandatory safety pause blocks this external action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandatoryPauseActiveError"

  # ─── Product autonomy contract ─────────────────────────────────────────────
  /autonomy/status:
    get:
      operationId: getAutonomyStatus
      tags: [autonomy]
      summary: Current product autonomy contract and acceptance status
      security:
        - bearerAuth: []
      parameters:
        - name: campaignId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Current contract status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyStatus"
  /autonomy/acceptances:
    post:
      operationId: acceptAutonomyContract
      tags: [autonomy]
      summary: Record idempotent contract acceptances
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutonomyAcceptanceInput"
      responses:
        "201":
          description: Acceptances recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyAcceptanceResponse"
  /autonomy/acceptances/{acceptanceId}/revoke:
    post:
      operationId: revokeAutonomyAcceptance
      tags: [autonomy]
      summary: Revoke a contract acceptance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/acceptanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutonomyRevocationInput"
      responses:
        "200":
          description: Acceptance revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyAcceptanceResponse"
  /autonomy/evidence:
    get:
      operationId: listAutonomyEvidence
      tags: [autonomy]
      summary: Contract acceptance evidence and history
      security:
        - bearerAuth: []
      parameters:
        - name: campaignId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Acceptance evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyEvidenceResponse"
  /autonomy/pauses:
    get:
      operationId: listMandatoryPauses
      tags: [autonomy]
      summary: List workspace mandatory safety pauses
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campaignId
          in: query
          schema: { type: string }
        - name: activeOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Mandatory pause history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandatoryPauseListResponse" }
    post:
      operationId: createMandatoryPause
      tags: [autonomy]
      summary: Create an idempotent mandatory safety pause
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MandatoryPauseInput" }
      responses:
        "201":
          description: Pause recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandatoryPauseResponse" }
  /autonomy/pauses/{pauseId}/resolve:
    post:
      operationId: resolveMandatoryPause
      tags: [autonomy]
      summary: Resolve a mandatory pause with human evidence
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/pauseId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MandatoryPauseResolutionInput" }
      responses:
        "200":
          description: Pause resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandatoryPauseResponse" }

  # ─── Intake ────────────────────────────────────────────────────────────────
  /intake/{campaignId}:
    get:
      operationId: getIntake
      tags: [intake]
      summary: Get intake data
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      responses:
        "200":
          description: Intake data and questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeResponse"
    post:
      operationId: saveIntake
      tags: [intake]
      summary: Save intake answers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeSaveInput"
      responses:
        "200":
          description: Saved intake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeResponse"

  /intake/{campaignId}/score:
    get:
      operationId: getIntakeScore
      tags: [intake]
      summary: Get launch readiness score
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      responses:
        "200":
          description: Readiness score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeScore"

  # ─── Launch Sequences ──────────────────────────────────────────────────────
  /launch-sequences:
    get:
      operationId: listSequences
      tags: [launch-sequences]
      summary: List launch sequences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sequence list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequences:
                    type: array
                    items:
                      $ref: "#/components/schemas/LaunchSequence"
                required: [sequences]
    post:
      operationId: createSequence
      tags: [launch-sequences]
      summary: Create launch sequence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceInput"
      responses:
        "201":
          description: Created sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchSequence"

  /launch-sequences/{sequenceId}:
    get:
      operationId: getSequence
      tags: [launch-sequences]
      summary: Get sequence with items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      responses:
        "200":
          description: Sequence detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequence:
                    $ref: "#/components/schemas/LaunchSequenceDetail"
                required: [sequence]

  /launch-sequences/{sequenceId}/generate:
    post:
      operationId: generateSequencePlan
      tags: [launch-sequences]
      summary: Generate AI sequence plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      responses:
        "200":
          description: Generated plan and items
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemsCreated:
                    type: integer
                  sequence:
                    $ref: "#/components/schemas/LaunchSequenceDetail"

  /launch-sequences/{sequenceId}/activate:
    post:
      operationId: activateSequence
      tags: [launch-sequences]
      summary: Activate sequence
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceActivationInput"
      responses:
        "200":
          description: Activated sequence
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequence:
                    $ref: "#/components/schemas/LaunchSequenceDetail"

  /launch-sequences/{sequenceId}/calendar:
    get:
      operationId: getSequenceCalendar
      tags: [launch-sequences]
      summary: Day-by-day launch calendar
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      responses:
        "200":
          description: Calendar view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"

  /launch-sequences/{sequenceId}/today:
    get:
      operationId: getSequenceToday
      tags: [launch-sequences]
      summary: Current day dashboard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sequenceId"
      responses:
        "200":
          description: Today view
          content:
            application/json:
              schema:
