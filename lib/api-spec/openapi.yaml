      required: [id, proposalId, workspaceId, attemptNumber, status, idempotencyKey, beforeSnapshot, createdAt]
    PaidMediaActionAttemptsResponse:
      type: object
      properties: { attempts: { type: array, items: { $ref: "#/components/schemas/PaidMediaActionAttempt" } } }
      required: [attempts]
    PaidMediaActionAttemptResponse:
      type: object
      properties: { attempt: { $ref: "#/components/schemas/PaidMediaActionAttempt" } }
      required: [attempt]
