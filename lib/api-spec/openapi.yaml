components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaidMediaProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [meta_ads, tiktok_ads, google_ads] }
    PaidMediaAccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaidMediaPolicyId:
      name: policyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaidMediaProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaidMediaAttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    campaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
    sequenceId:
      name: sequenceId
      in: path
      required: true
      schema:
        type: string
    acceptanceId:
      name: acceptanceId
      in: path
      required: true
      schema:
        type: string
    pauseId:
      name: pauseId
      in: path
      required: true
      schema: { type: string }

  schemas:
    LifecycleOverview:
      type: object
      required: [contactStages, actions, referrals, ltv]
      properties:
        contactStages: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        actions: { type: object, additionalProperties: { type: object, additionalProperties: { type: integer, minimum: 0 } } }
        referrals: { type: object, additionalProperties: true }
        ltv:
          type: object
          required: [contacts, recordedLifetimeValueCents, attribution]
          properties:
            contacts: { type: integer, minimum: 0 }
            recordedLifetimeValueCents: { type: integer }
            attribution: { type: string, const: recorded_local_ledger_not_externally_attributed_kpi }
    LifecycleActionsResponse:
      type: object
      required: [actions, pagination]
      properties:
        actions:
          type: array
          items:
            type: object
            required: [id, type, status, createdAt]
            properties:
              id: { type: string, format: uuid }
              type: { type: string, enum: [recovery, onboarding, retention, upsell] }
              status: { type: string, enum: [pending, claimed, completed, failed, suppressed] }
              channel: { type: string }
              reason: { type: string, nullable: true }
              riskScore: { type: integer, nullable: true }
              createdAt: { type: string, format: date-time }
              completedAt: { type: string, format: date-time, nullable: true }
        pagination:
          type: object
          required: [limit, offset, total]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total: { type: integer }
    LifecycleContact:
      type: object
      additionalProperties: false
      required: [id, displayLabel, email, stage, churnRisk, lastActivityAt]
      properties:
        id: { type: string, format: uuid }
        displayLabel: { type: string }
        email: { type: string, nullable: true }
        stage: { type: string }
        churnRisk: { type: integer, minimum: 0, maximum: 100 }
        lastActivityAt: { type: string, format: date-time, nullable: true }
    LifecycleContactsResponse:
      type: object
      required: [contacts, pagination]
      properties:
        contacts: { type: array, items: { $ref: "#/components/schemas/LifecycleContact" } }
        pagination:
          type: object
          required: [limit, offset]
          properties:
            limit: { type: integer }
            offset: { type: integer }
    LifecycleTimelineResponse:
      type: object
      required: [contact, events, onboarding, recovery, pagination]
      properties:
        contact: { $ref: "#/components/schemas/LifecycleContact" }
        events:
          type: array
          items:
            type: object
