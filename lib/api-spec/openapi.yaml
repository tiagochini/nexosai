      required: [policy]
    PaidMediaProposalDecisionInput:
      type: object
      properties:
        evidence: { type: object, additionalProperties: {} }
        comment: { type: string }
    PaidMediaError:
      type: object
      properties: { error: { type: string }, code: { type: string } }
      required: [error, code]
    PaidMediaProposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        accountId: { type: [string, "null"], format: uuid }
        entityId: { type: [string, "null"], format: uuid }
        provider: { type: string, enum: [meta_ads, tiktok_ads, google_ads] }
        actionType: { type: string, enum: [pause, resume, update_daily_budget, update_bid, update_creative_status, update_creative_rotation, cross_platform_budget_move] }
        status: { type: string, enum: [pending_approval, approved, rejected, expired, executing, verified, failed, rolled_back] }
        idempotencyKey: { type: string }
        recommendation: { type: string }
        metrics: { type: object, additionalProperties: {} }
        simulation: { type: object, additionalProperties: {} }
        beforeAllocation: { type: object, additionalProperties: {} }
        afterAllocation: { type: object, additionalProperties: {} }
