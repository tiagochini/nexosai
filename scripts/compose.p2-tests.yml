services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexos_p2
    ports: ["127.0.0.1:55440:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexos_p2"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    extends:
      file: ../ops/redis/compose.yml
      service: redis
  redis-restore:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56391:6379"]
    volumes: ["redis-restore-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
secrets:
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?P2 runner must create the test secret}
volumes:
  postgres-data:
  redis-data:
  redis-restore-data:
