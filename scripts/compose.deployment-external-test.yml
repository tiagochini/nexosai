services:
  postgres-external:
    image: postgres:17
    environment:
      POSTGRES_USER: nexos
      POSTGRES_DB: nexos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    entrypoint: [sh, -ec]
    command:
      - |
        cp /fixtures/server.pem /tmp/server.pem
        cp /fixtures/server.key /tmp/server.key
        chown postgres:postgres /tmp/server.pem /tmp/server.key
        chmod 600 /tmp/server.key
        exec /usr/local/bin/docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.pem -c ssl_key_file=/tmp/server.key
    volumes:
      - ${DEPLOYMENT_TEST_DIR:?Owned test directory required}:/fixtures:ro
      - external-data:/var/lib/postgresql/data
    networks:
      database:
        aliases: [outside-db]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nexos -d nexos]
      interval: 3s
      timeout: 3s
      retries: 30
networks:
  database:
    name: ${NEXOS_DATABASE_NETWORK:?Owned test network required}
    internal: true
volumes:
  external-data:
secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Owned password required}
