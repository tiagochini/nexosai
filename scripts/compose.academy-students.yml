services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexos_academy_students_test
    ports:
      - "127.0.0.1:55443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d nexos_academy_students_test"]
      interval: 2s
      timeout: 3s
      retries: 30
