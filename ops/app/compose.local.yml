services:
  api:
    environment: { DATABASE_MODE: local }
    secrets: [postgres_password]
    depends_on:
      postgres: { condition: service_healthy }
  db-tools:
    environment: { DATABASE_MODE: local }
    secrets: [postgres_password]
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: nexos
      POSTGRES_DB: nexos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nexos -d nexos]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set the local PostgreSQL password file path}
